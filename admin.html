<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - MRSTORE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      background: #050713;
      color: #fff;
      padding: 20px;
    }

    .panel {
      max-width: 1100px;
      margin: 0 auto;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #38bdf8;
      font-size: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding-bottom: 16px;
    }

    .header h2 {
      font-size: 22px;
    }

    .header p {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .btn.primary {
      background: linear-gradient(100deg, #2563eb, #9333ea);
    }

    .btn.danger {
      background: #ef4444;
    }

    .btn.chat {
      background: #3b82f6;
    }

    .btn.status {
      background: #10b981;
    }

    .btn.status.pending {
      background: #f59e0b;
      color: #000;
    }

    .table-wrap {
      overflow-x: auto;
      background: rgba(13, 18, 35, 0.9);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th, td {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    th {
      background: rgba(255,255,255,.02);
      color: #38bdf8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      color: #000;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-box {
      width: min(500px, 100%);
      min-height: 620px;
      background: #121826;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      margin-bottom: 14px;
    }

    .chat-title {
      color: #38bdf8;
      font-size: 18px;
    }

    .chat-client {
      font-size: 12px;
      color: #94a3b8;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
    }

    .msg.admin {
      align-self: flex-end;
      background: #10b981;
      color: black;
    }

    .msg.user {
      align-self: flex-start;
      background: #374151;
      color: white;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.14);
      background: #07090e;
      color: white;
      outline: none;
    }

    .send-button {
      border: 0;
      background: #38bdf8;
      color: #000;
      border-radius: 10px;
      padding: 0 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="loading" class="loading">
    Verificando seguridad de administrador...
  </div>

  <div id="panel" class="panel">
    <div class="header">
      <div>
        <h2>Panel de Administración Integral</h2>
        <p>Gestión de tickets y soporte - MRSTORE</p>
      </div>

      <div class="actions">
        <button class="btn primary" onclick="cargarTicketsAdmin()">🔄 Actualizar panel</button>
        <button class="btn danger" onclick="cerrarSesionAdmin()">Cerrar sesión</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Cliente</th>
            <th>Detalles</th>
            <th>Total</th>
            <th>Estado</th>
            <th style="text-align:right;">Acciones</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr>
            <td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">
              Cargando tickets...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="chatModal" class="modal">
    <div class="chat-box">
      <div class="chat-header">
        <div>
          <div id="chatTitle" class="chat-title">Chat del ticket</div>
          <div id="chatClientName" class="chat-client">Cliente</div>
        </div>

        <button class="btn danger" onclick="cerrarChat()">Cerrar</button>
      </div>

      <div id="chatMessages" class="chat-messages"></div>

      <div class="chat-input-area">
        <input id="chatInput" type="text" placeholder="Responde al cliente..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
        <button class="send-button" onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://oekzjffzxhluhhpptngy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Oyy8-ryDioF-OEV8LA4Gyg_XJmhl4EH';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let ticketActivoChat = null;

    window.addEventListener('DOMContentLoaded', verificarAdmin);

    async function verificarAdmin() {
      const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

      if (sessionError || !session) {
        alert('Debes iniciar sesión para acceder al panel.');
        window.location.href = 'index.html';
        return;
      }

      const { data: perfil, error: perfilError } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (perfilError || !perfil || perfil.role !== 'admin') {
        alert('Acceso denegado: esta cuenta no es administradora.');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('panel').style.display = 'block';

      await cargarTicketsAdmin();
    }

    async function cerrarSesionAdmin() {
      await supabaseClient.auth.signOut();
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = 'index.html';
    }

    async function cargarTicketsAdmin() {
      const tbody = document.getElementById('adminTableBody');

      const { data, error } = await supabaseClient
        .from('tickets')
        .select('*')
        .order('created_at', { ascending: false });

      tbody.innerHTML = '';

      if (error) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align:center; color:#ef4444; padding:30px;">
              Error de BD: ${error.message}
            </td>
          </tr>
        `;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">
              No hay tickets registrados.
            </td>
          </tr>
        `;
        return;
      }

      data.forEach(ticket => {
        const estadoActual = ticket.estado || 'Pendiente';
        const isDone = estadoActual === 'Completado';
        const badgeColor = isDone ? '#10b981' : '#f59e0b';
        const btnText = isDone ? 'Marcar Pendiente' : 'Marcar Completado';
        const btnClass = isDone ? 'btn status pending' : 'btn status';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:#38bdf8; font-weight:800;">${ticket.codigo}</td>
          <td>${ticket.cliente}</td>
          <td style="color:#cbd5e1; max-width:260px;">${ticket.detalles}</td>
          <td style="font-weight:800;">$${Number(ticket.total).toFixed(2)}</td>
          <td><span class="badge" style="background:${badgeColor};">${estadoActual}</span></td>
          <td style="text-align:right;">
            <button class="btn chat" onclick="abrirChat('${ticket.codigo}', '${ticket.cliente}')">💬 Chat</button>
            <button class="${btnClass}" onclick="cambiarEstado('${ticket.id}', '${estadoActual}')">🔄 ${btnText}</button>
            <button class="btn danger" onclick="eliminarTicket('${ticket.id}')">🗑️</button>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    async function cambiarEstado(idTicket, estadoActual) {
      const nuevoEstado = estadoActual === 'Completado' ? 'Pendiente' : 'Completado';

      const { error } = await supabaseClient
        .from('tickets')
        .update({ estado: nuevoEstado })
        .eq('id', idTicket);

      if (error) {
        alert('Error al actualizar: ' + error.message);
      } else {
        await cargarTicketsAdmin();
      }
    }

    async function eliminarTicket(idTicket) {
      if (!confirm('¿Deseas eliminar este ticket?')) return;

      const { error } = await supabaseClient
        .from('tickets')
        .delete()
        .eq('id', idTicket);

      if (error) {
        alert('Error al eliminar: ' + error.message);
      } else {
        await cargarTicketsAdmin();
      }
    }

    async function abrirChat(codigo, cliente) {
      ticketActivoChat = codigo;

      document.getElementById('chatTitle').innerText = 'Ticket: ' + codigo;
      document.getElementById('chatClientName').innerText = 'Hablando con: ' + cliente;

      document.getElementById('chatModal').style.display = 'flex';

      await cargarMensajesAdmin();
    }

    function cerrarChat() {
      document.getElementById('chatModal').style.display = 'none';
      ticketActivoChat = null;
    }

    async function cargarMensajesAdmin() {
      if (!ticketActivoChat) return;

      const { data: ticketData, error: ticketError } = await supabaseClient
        .from('tickets')
        .select('id')
        .eq('codigo', ticketActivoChat)
        .single();

      if (ticketError || !ticketData) {
        console.error(ticketError);
        return;
      }

      const { data, error } = await supabaseClient
        .from('mensajes')
        .select('*')
        .eq('ticket_id', ticketData.id)
        .order('created_at', { ascending: true });

      const box = document.getElementById('chatMessages');
      box.innerHTML = '';

      if (!data || data.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:#94a3b8; margin-top:20px;">Aún no hay mensajes.</div>';
        return;
      }

      data.forEach(mensaje => {
        const isAdmin = mensaje.user_id === supabaseClient.auth.getSession()?.data?.session?.user?.id;
        box.innerHTML += `
          <div class="msg ${isAdmin ? 'admin' : 'user'}">
            <strong style="display:block; margin-bottom:4px; font-size:10px; opacity:.8;">
              ${isAdmin ? 'Admin' : 'Cliente'}
            </strong>
            ${mensaje.contenido || ''}
          </div>
        `;
      });

      box.scrollTop = box.scrollHeight;
    }

    async function enviarMensaje() {
      if (!ticketActivoChat) return;

      const input = document.getElementById('chatInput');
      const texto = input.value.trim();

      if (!texto) return;

      const { data: ticketData, error: ticketError } = await supabaseClient
        .from('tickets')
        .select('id')
        .eq('codigo', ticketActivoChat)
        .single();

      if (ticketError || !ticketData) {
        alert('No se pudo localizar el ticket.');
        return;
      }

      const { data: sessionData } = await supabaseClient.auth.getSession();

      const { error } = await supabaseClient
        .from('mensajes')
        .insert({
          ticket_id: ticketData.id,
          user_id: sessionData.session.user.id,
          contenido: texto
        });

      if (error) {
        alert('Error al enviar el mensaje: ' + error.message);
        return;
      }

      input.value = '';
      await cargarMensajesAdmin();
    }
  </script>
</body>
</html>
