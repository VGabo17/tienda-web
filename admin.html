<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRSTORE - Administración</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #050713;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(1250px, 100%);
      margin: auto;
    }

    .loading {
      padding: 50px;
      color: #38bdf8;
      text-align: center;
      font-size: 18px;
    }

    .admin-panel {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
      padding: 20px;
      border: 1px solid rgba(56, 189, 248, .25);
      border-radius: 18px;
      background: linear-gradient(135deg, #111a35, #17102e);
      box-shadow: 0 0 35px rgba(37, 99, 235, .15);
    }

    .brand {
      color: white;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span {
      color: #c084fc;
    }

    .subtitle {
      margin-top: 7px;
      color: #94a3b8;
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      padding: 11px 15px;
      border: 0;
      border-radius: 9px;
      color: white;
      font-weight: bold;
    }

    .button-primary {
      background: linear-gradient(100deg, #2563eb, #9333ea);
    }

    .button-danger {
      background: #dc2626;
    }

    .button-chat {
      background: #0891b2;
    }

    .button-status {
      background: #16a34a;
    }

    .button-status.pending {
      background: #f59e0b;
      color: #111827;
    }

    .table-container {
      overflow-x: auto;
      border: 1px solid rgba(148, 163, 184, .16);
      border-radius: 18px;
      background: rgba(13, 18, 39, .9);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 15px;
      border-bottom: 1px solid rgba(148, 163, 184, .12);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: #38bdf8;
      background: rgba(255, 255, 255, .03);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    td {
      color: #e2e8f0;
      font-size: 14px;
    }

    .ticket-code {
      color: #67e8f9;
      font-weight: bold;
    }

    .details {
      max-width: 260px;
      color: #cbd5e1;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 30px;
      background: #f59e0b;
      color: #111827;
      font-size: 11px;
      font-weight: bold;
    }

    .status-badge.completed {
      background: #22c55e;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .78);
    }

    .modal.open {
      display: flex;
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      width: min(560px, 100%);
      height: min(650px, 90vh);
      padding: 20px;
      border: 1px solid rgba(56, 189, 248, .3);
      border-radius: 18px;
      background: #0d132a;
      box-shadow: 0 0 40px rgba(37, 99, 235, .25);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(148, 163, 184, .15);
    }

    .chat-title {
      color: #67e8f9;
      font-size: 19px;
      font-weight: bold;
    }

    .chat-client {
      margin-top: 5px;
      color: #94a3b8;
      font-size: 12px;
    }

    .messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      margin: 15px 0;
      padding: 12px;
      border-radius: 12px;
      background: #050713;
    }

    .message {
      max-width: 82%;
      padding: 11px 13px;
      border-radius: 12px;
      color: white;
      line-height: 1.4;
      font-size: 14px;
    }

    .message.admin {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #9333ea);
    }

    .message.client {
      align-self: flex-start;
      background: #263244;
    }

    .message small {
      display: block;
      margin-bottom: 4px;
      opacity: .75;
      font-size: 10px;
    }

    .chat-form {
      display: flex;
      gap: 8px;
    }

    .chat-form input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 9px;
      outline: none;
      background: #050713;
      color: white;
    }

    .chat-form input:focus {
      border-color: #38bdf8;
    }

    .empty {
      padding: 30px;
      color: #94a3b8;
      text-align: center;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions .button {
        flex: 1;
      }

      .row-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div id="loading" class="loading">
      Verificando acceso de administrador...
    </div>

    <main id="adminPanel" class="admin-panel">
      <header class="topbar">
        <div>
          <div class="brand">MR<span>STORE</span></div>
          <div class="subtitle">Panel de administración y soporte</div>
        </div>

        <div class="actions">
          <button class="button button-primary" onclick="cargarTickets()">
            Actualizar
          </button>

          <button class="button button-danger" onclick="cerrarSesion()">
            Cerrar sesión
          </button>
        </div>
      </header>

      <section class="table-container">
        <table>
          <thead>
            <tr>
              <th>Ticket</th>
              <th>Cliente</th>
              <th>Detalles</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="ticketsTable">
            <tr>
              <td colspan="6" class="empty">Cargando tickets...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="chatModal" class="modal">
    <div class="chat-box">
      <div class="chat-header">
        <div>
          <div id="chatTitle" class="chat-title">Chat del ticket</div>
          <div id="chatClient" class="chat-client">Cliente</div>
        </div>

        <button class="button button-danger" onclick="cerrarChat()">
          Cerrar
        </button>
      </div>

      <div id="messages" class="messages"></div>

      <form class="chat-form" onsubmit="enviarMensaje(event)">
        <input
          id="messageInput"
          type="text"
          placeholder="Escribe una respuesta..."
          autocomplete="off"
        >

        <button class="button button-primary" type="submit">
          Enviar
        </button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://oekzjffzxhluhhpptngy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Oyy8-ryDioF-OEV8LA4Gyg_XJmhl4EH';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let sesionAdmin = null;
    let ticketSeleccionado = null;
    let usuarioAdminId = null;

    document.addEventListener('DOMContentLoaded', iniciarAdmin);

    async function iniciarAdmin() {
      const respuesta = await supabaseClient.auth.getSession();

      if (respuesta.error || !respuesta.data.session) {
        alert('Debes iniciar sesión para acceder.');
        window.location.href = 'index.html';
        return;
      }

      sesionAdmin = respuesta.data.session;
      usuarioAdminId = sesionAdmin.user.id;

      const perfil = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', usuarioAdminId)
        .maybeSingle();

      if (
        perfil.error ||
        !perfil.data ||
        perfil.data.role !== 'admin'
      ) {
        alert('Acceso denegado. Esta cuenta no es administradora.');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';

      await cargarTickets();
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    async function cargarTickets() {
      const tabla = document.getElementById('ticketsTable');

      const respuesta = await supabaseClient
        .from('tickets')
        .select('*')
        .order('created_at', { ascending: false });

      if (respuesta.error) {
        tabla.innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              Error: ${respuesta.error.message}
            </td>
          </tr>
        `;
        return;
      }

      if (!respuesta.data || respuesta.data.length === 0) {
        tabla.innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              No hay tickets registrados.
            </td>
          </tr>
        `;
        return;
      }

      tabla.innerHTML = respuesta.data.map(ticket => {
        const completado = ticket.estado === 'Completado';
        const estadoClase = completado ? 'completed' : '';
        const textoBoton = completado
          ? 'Marcar pendiente'
          : 'Completar';

        return `
          <tr>
            <td class="ticket-code">${escapeHTML(ticket.codigo)}</td>

            <td>${escapeHTML(ticket.cliente)}</td>

            <td class="details">
              ${escapeHTML(ticket.detalles)}
            </td>

            <td>
              $${Number(ticket.total || 0).toFixed(2)}
            </td>

            <td>
              <span class="status-badge ${estadoClase}">
                ${escapeHTML(ticket.estado || 'Pendiente')}
              </span>
            </td>

            <td>
              <div class="row-actions">
                <button
                  class="button button-chat"
                  onclick="abrirChat('${ticket.id}', '${escapeAttribute(ticket.codigo)}', '${escapeAttribute(ticket.cliente)}')">
                  Chat
                </button>

                <button
                  class="button button-status ${completado ? 'pending' : ''}"
                  onclick="cambiarEstado('${ticket.id}', '${escapeAttribute(ticket.estado || 'Pendiente')}')">
                  ${textoBoton}
                </button>

                <button
                  class="button button-danger"
                  onclick="eliminarTicket('${ticket.id}')">
                  Eliminar
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function cambiarEstado(ticketId, estadoActual) {
      const nuevoEstado = estadoActual === 'Completado'
        ? 'Pendiente'
        : 'Completado';

      const respuesta = await supabaseClient
        .from('tickets')
        .update({ estado: nuevoEstado })
        .eq('id', ticketId);

      if (respuesta.error) {
        alert('No se pudo actualizar el ticket: ' + respuesta.error.message);
        return;
      }

      await cargarTickets();
    }

    async function eliminarTicket(ticketId) {
      const confirmar = confirm(
        '¿Seguro que quieres eliminar este ticket?'
      );

      if (!confirmar) return;

      const respuesta = await supabaseClient
        .from('tickets')
        .delete()
        .eq('id', ticketId);

      if (respuesta.error) {
        alert('No se pudo eliminar: ' + respuesta.error.message);
        return;
      }

      await cargarTickets();
    }

    async function abrirChat(ticketId, codigo, cliente) {
      ticketSeleccionado = ticketId;

      document.getElementById('chatTitle').textContent =
        'Ticket ' + codigo;

      document.getElementById('chatClient').textContent =
        'Cliente: ' + cliente;

      document.getElementById('chatModal').classList.add('open');

      await cargarMensajes();
    }

    function cerrarChat() {
      ticketSeleccionado = null;
      document.getElementById('chatModal').classList.remove('open');
    }

    async function cargarMensajes() {
      const contenedor = document.getElementById('messages');

      if (!ticketSeleccionado) return;

      const respuesta = await supabaseClient
        .from('mensajes')
        .select('*')
        .eq('ticket_id', ticketSeleccionado)
        .order('created_at', { ascending: true });

      if (respuesta.error) {
        contenedor.innerHTML = `
          <div class="empty">
            Error al cargar mensajes.
          </div>
        `;
        return;
      }

      if (!respuesta.data || respuesta.data.length === 0) {
        contenedor.innerHTML = `
          <div class="empty">
            Todavía no hay mensajes.
          </div>
        `;
        return;
      }

      contenedor.innerHTML = respuesta.data.map(mensaje => {
        const esAdmin = mensaje.user_id === usuarioAdminId;

        return `
          <div class="message ${esAdmin ? 'admin' : 'client'}">
            <small>${esAdmin ? 'Administrador' : 'Cliente'}</small>
            ${escapeHTML(mensaje.contenido || '')}
          </div>
        `;
      }).join('');

      contenedor.scrollTop = contenedor.scrollHeight;
    }

    async function enviarMensaje(event) {
      event.preventDefault();

      if (!ticketSeleccionado || !sesionAdmin) return;

      const input = document.getElementById('messageInput');
      const texto = input.value.trim();

      if (!texto) return;

      const respuesta = await supabaseClient
        .from('mensajes')
        .insert({
          ticket_id: ticketSeleccionado,
          user_id: usuarioAdminId,
          contenido: texto
        });

      if (respuesta.error) {
        alert('No se pudo enviar el mensaje: ' + respuesta.error.message);
        return;
      }

      input.value = '';
      await cargarMensajes();
    }

    function escapeHTML(valor) {
      return String(valor)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttribute(valor) {
      return String(valor)
        .replaceAll('\\', '\\\\')
        .replaceAll("'", "\\'")
        .replaceAll('"', '&quot;');
    }

    document.getElementById('chatModal').addEventListener('click', function(event) {
      if (event.target === this) {
        cerrarChat();
      }
    });
  </script>
</body>
</html>
