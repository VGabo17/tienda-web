<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MRSTORE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #07090e; color: #fff; padding: 20px; }
        .admin-container { max-width: 1100px; margin: 0 auto; display: none; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; }
        .admin-header h2 { font-size: 22px; color: #fff; }
        .admin-header p { font-size: 14px; color: #94a3b8; margin-top: 5px; }
        
        .btn-action { color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: opacity 0.2s; }
        .btn-action:hover { opacity: 0.8; }
        .btn-primary { background: #8b5cf6; padding: 10px 20px; font-size: 14px; }
        .btn-chat { background: #3b82f6; }
        .btn-status { background: #10b981; }
        .btn-status.pendiente { background: #f59e0b; color: #000; }
        .btn-danger { background: #ef4444; }
        .btn-logout { background: #ef4444; padding: 10px 20px; font-size: 14px; margin-left: 10px; }

        .table-responsive { width: 100%; overflow-x: auto; background: rgba(18, 24, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        th { background: rgba(255,255,255,0.02); color: #38bdf8; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #000; }
        
        #chat-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .chat-box { background: #121826; width: 100%; max-width: 500px; border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; height: 550px; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px; }
        .chat-messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding-right: 5px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: 85%; line-height: 1.4; }
        .msg-admin { background: #10b981; align-self: flex-end; color: black; border-bottom-right-radius: 2px; }
        .msg-cliente { background: #374151; align-self: flex-start; color: white; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #07090e; color: white; outline: none; }
        .btn-send { background: #38bdf8; color: black; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading-screen" style="text-align:center; padding: 50px; font-size: 18px; color: #38bdf8;">
    Verificando seguridad de administrador...
</div>

<div class="admin-container" id="admin-panel">
    <div class="admin-header">
        <div>
            <h2>Panel de Administración Integral</h2>
            <p>Gestión de Tickets y Soporte - MRSTORE</p>
        </div>
        <div>
            <button class="btn-action btn-primary" onclick="cargarTicketsAdmin()">🔄 Actualizar Panel</button>
            <button class="btn-action btn-logout" onclick="cerrarSesionAdmin()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Cliente</th>
                    <th>Detalles</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th style="text-align: right;">Acciones</th>
                </tr>
            </thead>
            <tbody id="admin-table-body">
                <tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 30px;">Cargando sistema...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="chat-modal">
    <div class="chat-box">
        <div class="chat-header">
            <div>
                <h3 id="chat-title" style="color: #38bdf8; font-size: 18px;">Chat de Soporte</h3>
                <span id="chat-cliente-name" style="font-size: 12px; color: #94a3b8;">Cliente</span>
            </div>
            <button onclick="cerrarChat()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Cerrar X</button>
        </div>
        
        <div class="chat-messages" id="chat-messages"></div>
        
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Responde al cliente..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
            <button class="btn-action" style="background: #4b5563;" onclick="cargarMensajes()" title="Actualizar Mensajes">🔄</button>
            <button class="btn-send" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://luupinikdeakeisitget.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PLfWM4kKES8hWFVIY5yatA_MT9Tm7Kq';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    const adminUser = "Soporte MRSTORE";
    let ticketActivoChat = null;

    window.addEventListener('DOMContentLoaded', verificarAdmin);

    async function verificarAdmin() {
        if (window.location.hash.includes("access_token")) {
            window.history.replaceState(null, null, window.location.pathname);
        }

        const { data: { session } } = await supabaseClient.auth.getSession();
        
        // Bloqueo estricto: Solo mrstore@gmail.com puede entrar
        if (!session || session.user.email !== 'mrstore@gmail.com') {
            alert('🚨 Acceso denegado: Solo el administrador "mrstore@gmail.com" puede entrar aquí.');
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        cargarTicketsAdmin();
    }

    async function cerrarSesionAdmin() {
        await supabaseClient.auth.signOut();
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'index.html';
    }

    async function cargarTicketsAdmin() {
        const { data, error } = await supabaseClient.from('tickets').select('*').order('id', { ascending: false });
        const tbody = document.getElementById('admin-table-body');
        tbody.innerHTML = '';

        if (error) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ef4444;">Error de BD: ${error.message}</td></tr>`;
            return;
        }
        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 30px;">No hay tickets registrados.</td></tr>`;
            return;
        }

        data.forEach(ticket => {
            const estadoActual = ticket.estado || 'Pendiente';
            const colorEstado = estadoActual === 'Completado' ? '#10b981' : '#f59e0b';
            const btnEstadoClass = estadoActual === 'Completado' ? 'btn-status pendiente' : 'btn-status';
            const btnEstadoText = estadoActual === 'Completado' ? 'Marcar Pendiente' : 'Marcar Completado';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color: #38bdf8; font-weight: bold;">${ticket.codigo}</td>
                <td style="font-weight: 500;">${ticket.cliente}</td>
                <td style="font-size: 13px; color: #cbd5e1; max-width: 250px;">${ticket.detalles}</td>
                <td style="font-weight: bold;">$${ticket.total}</td>
                <td><span class="badge" style="background: ${colorEstado};">${estadoActual}</span></td>
                <td style="text-align: right;">
                    <button class="btn-action btn-chat" onclick="abrirChat('${ticket.codigo}', '${ticket.cliente}')">💬 Chat</button>
                    <button class="btn-action ${btnEstadoClass}" onclick="cambiarEstado(${ticket.id}, '${estadoActual}')">🔄 ${btnEstadoText}</button>
                    <button class="btn-action btn-danger" onclick="eliminarTicket(${ticket.id})">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function cambiarEstado(idTicket, estadoActual) {
        const nuevoEstado = estadoActual === 'Completado' ? 'Pendiente' : 'Completado';
        const { error } = await supabaseClient.from('tickets').update({ estado: nuevoEstado }).eq('id', idTicket);
        if (error) alert('Error al actualizar: ' + error.message);
        else cargarTicketsAdmin();
    }

    async function eliminarTicket(idTicket) {
        if (!confirm('¿Estás seguro de eliminar este ticket permanentemente?')) return;
        const { error } = await supabaseClient.from('tickets').delete().eq('id', idTicket);
        if (error) alert('Error al eliminar: ' + error.message);
        else cargarTicketsAdmin();
    }

    async function abrirChat(codigo, cliente) {
        ticketActivoChat = codigo;
        document.getElementById('chat-title').innerText = 'Ticket: ' + codigo;
        document.getElementById('chat-cliente-name').innerText = 'Hablando con: ' + cliente;
        document.getElementById('chat-modal').style.display = 'flex';
        cargarMensajes();
    }

    function cerrarChat() {
        document.getElementById('chat-modal').style.display = 'none';
        ticketActivoChat = null;
    }

    async function cargarMensajes() {
        if (!ticketActivoChat) return;
        const { data } = await supabaseClient.from('mensajes').select('*').eq('ticket_codigo', ticketActivoChat).order('created_at', { ascending: true });
        const box = document.getElementById('chat-messages');
        box.innerHTML = '';

        if (!data || data.length === 0) {
            box.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:13px; margin-top:20px;">El cliente no ha enviado mensajes aún.</div>';
            return;
        }

        data.forEach(msg => {
            const isAdmin = msg.autor === adminUser;
            box.innerHTML += `
                <div class="msg ${isAdmin ? 'msg-admin' : 'msg-cliente'}">
                    <b style="font-size:11px; opacity:0.8; display:block; margin-bottom:3px;">${msg.autor}</b>
                    ${msg.contenido}
                </div>`;
        });
        box.scrollTop = box.scrollHeight;
    }

    async function enviarMensaje() {
        const input = document.getElementById('chat-input');
        const texto = input.value.trim();
        if (!texto || !ticketActivoChat) return;
        input.disabled = true;
        await supabaseClient.from('mensajes').insert([{ ticket_codigo: ticketActivoChat, autor: adminUser, contenido: texto }]);
        input.value = '';
        input.disabled = false;
        input.focus();
        cargarMensajes();
    }
</script>
</body>
</html>
