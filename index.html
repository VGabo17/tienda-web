<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aledevv | Synthetix Labs Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #050505;
            --surface: #0e0e0e;
            --border: #222;
            --border-hover: #444;
            --text-main: #ededed;
            --text-muted: #888;
            --cyan-glow: rgba(0, 242, 254, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 0%, #111 0%, transparent 70%);
            min-height: 100vh;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
            grid-auto-rows: minmax(180px, auto);
        }

        .bento-item {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .bento-item:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .item-hero { grid-column: span 4; }
        .item-square { grid-column: span 1; }

        /* Ajustes responsivos corregidos */
        @media (max-width: 900px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
            .item-hero { grid-column: span 2; }
            .item-square { grid-column: span 1; }
        }
        
        @media (max-width: 600px) {
            .bento-grid { grid-template-columns: 1fr; }
            .item-hero { grid-column: span 1; }
            .item-square { grid-column: span 1; }
        }

        .badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #fff;
            background: #222;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            margin-bottom: 1.2rem;
            border: 1px solid #333;
        }

        h1 { font-size: clamp(2rem, 4vw, 3.5rem); margin-bottom: 1rem; line-height: 1.1; }
        h3 { font-size: 1.2rem; font-weight: 500; margin-bottom: 0.5rem; }
        p { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }
        
        .price-tag {
            font-family: 'JetBrains Mono', monospace;
            color: #4facfe;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 1rem;
        }

        .btn-group { display: flex; gap: 1rem; margin-top: 1.5rem; }
        
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-primary { background: var(--text-main); color: var(--bg-main); }
        .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border); width: 100%; text-align: center; display: block; }
        .btn-secondary:hover { background: #111; border-color: #444; }

        /* Contenedor dinámico para los productos */
        #productos-dinamicos {
            display: contents;
        }
    </style>
</head>
<body>

    <div class="bento-grid">
        <!-- Hero Section -->
        <div class="bento-item item-hero">
            <span class="badge">Marketplace Oficial</span>
            <h1>Synthetix Labs.</h1>
            <p style="max-width: 600px;">
                Descarga setups, plugins custom y optimizaciones Fabric desarrolladas por Aledevv. 
                Infraestructura de alto rendimiento para tu network.
            </p>
        </div>

        <!-- Aquí se inyectarán los productos desde Java -->
        <div id="productos-dinamicos">
            <p style="grid-column: span 1; text-align: center; color: #888;">Cargando recursos...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarRecursos();
        });

        async function cargarRecursos() {
            const contenedor = document.getElementById('productos-dinamicos');
            
            try {
                // Forzamos el error intencionalmente en GitHub Pages para usar los datos locales hasta tener el hosting
                throw new Error("Backend Java en configuración");

            } catch (error) {
                const datosSimulados = [
                    { id: "1", title: "Velocity Proxy Setup Premium", category: "Setups", price: "15.00" },
                    { id: "2", title: "NixerAntiCheat Pro", category: "Plugins", price: "0.00" },
                    { id: "3", title: "Ale Optimized Modpack", category: "Modpacks", price: "0.00" },
                    { id: "4", title: "Discord Auth Bot", category: "Bots", price: "5.00" }
                ];

                contenedor.innerHTML = ''; 

                datosSimulados.forEach(recurso => {
                    const precioFormateado = recurso.price === "0.00" ? "Gratis" : `$${recurso.price}`;
                    
                    const tarjetaHTML = `
                        <div class="bento-item item-square">
                            <span class="badge">${recurso.category}</span>
                            <h3>${recurso.title}</h3>
                            <p class="price-tag">${precioFormateado}</p>
                            <div class="btn-group">
                                <a href="#" class="btn btn-secondary">Añadir al Carrito</a>
                            </div>
                        </div>
                    `;
                    
                    contenedor.innerHTML += tarjetaHTML;
                });
            }
        }
    </script>
</body>
</html>
