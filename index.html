<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRSTORE - Digital Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #07090e; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 550px; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header span { color: #38bdf8; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        .card { background: rgba(18, 24, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        
        /* Catálogo de Productos */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .product-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 15px; text-align: center; transition: transform 0.2s; }
        .product-item:hover { transform: translateY(-3px); background: rgba(255,255,255,0.05); }
        .product-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #e2e8f0; }
        .product-price { color: #38bdf8; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .btn-add { background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; width: 100%; }
        .btn-add:hover { background: #2563eb; }

        /* Carrito */
        .cart-item { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cart-empty { text-align: center; color: #94a3b8; font-size: 13px; padding: 10px; }
        .total-box { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-size: 18px; font-weight: bold; }
        .total-price { color: #38bdf8; }
        .btn { width: 100%; background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; opacity: 0.5; pointer-events: none; }
        .btn.active { opacity: 1; pointer-events: auto; }
        .btn-clear { background: transparent; color: #ef4444; border: none; cursor: pointer; font-size: 12px; text-decoration: underline; margin-top: 10px; width: 100%; }

        .user-box { background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 14px; color: #cbd5e1; }
        .user-box span { color: #38bdf8; font-weight: bold; }
        
        /* Tickets y Modal (Mantienen igual) */
        .ticket-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .ticket-code { color: #38bdf8; font-weight: bold; font-size: 15px; }
        .ticket-desc { color: #94a3b8; font-size: 13px; margin-bottom: 8px; }
        .ticket-footer { display: flex; justify-content: space-between; align-items: center; }
        .ticket-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #000; }
        .btn-chat { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

        #chat-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .chat-box { background: #121826; width: 100%; max-width: 450px; border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; height: 500px; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px; }
        .chat-messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; max-width: 85%; line-height: 1.4; }
        .msg-mio { background: #3b82f6; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .msg-otro { background: #374151; align-self: flex-start; color: white; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #07090e; color: white; outline: none; }
        .btn-send { background: #10b981; color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ MRSTORE</h1>
        <span>Digital Vault</span>
    </div>

    <!-- Catálogo de Productos -->
    <div class="card">
        <h3 style="margin-bottom: 15px; font-size: 16px;">🔥 Catálogo de Productos</h3>
        <div class="products-grid" id="catalogo-productos">
            <!-- Los productos se cargan desde JavaScript -->
        </div>
    </div>

    <!-- Sección del Carrito -->
    <div class="card">
        <h3 style="margin-bottom: 15px; font-size: 16px;">🛒 Tu Carrito de Compras</h3>
        <div id="cart-content">
            <div class="cart-empty">Tu carrito está vacío</div>
        </div>
        
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 15px 0;">
        <div class="total-box">
            <span>Total a Pagar:</span>
            <span class="total-price" id="cart-total">$0.00</span>
        </div>

        <div class="user-box">Conectado como: <span id="discord-user">@vgabo17</span></div>

        <button class="btn" id="btn-comprar" onclick="generarTicket()">🚀 Generar Ticket de Compra</button>
        <button class="btn-clear" onclick="vaciarCarrito()">Vaciar carrito</button>
    </div>

    <!-- Sección de Mis Tickets -->
    <div class="card" id="user-tickets-section" style="display: none;">
        <h3 style="margin-bottom: 15px; font-size: 16px;">📦 Tus Tickets Activos</h3>
        <div id="tickets-list-container"></div>
    </div>
</div>

<!-- Modal de Chat (Se mantiene igual) -->
<div id="chat-modal">
    <div class="chat-box">
        <div class="chat-header">
            <div>
                <h3 id="chat-title" style="color: #38bdf8; font-size: 18px;">Chat del Ticket</h3>
                <span style="font-size: 12px; color: #94a3b8;">Soporte MRSTORE</span>
            </div>
            <button onclick="cerrarChat()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Cerrar X</button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe tu mensaje aquí..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
            <button class="btn-send" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
</div>

<script>
    // 1. Configuración Principal
    const SUPABASE_URL = 'https://luupinikdeakeisitget.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PLfWM4kKES8hWFVIY5yatA_MT9Tm7Kq';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let usuarioActual = localStorage.getItem('discord_user') || '@vgabo17';
    document.getElementById('discord-user').innerText = usuarioActual;

    // 2. Base de Datos de Productos (Puedes modificar precios y nombres aquí)
    const productosDB = [
        { id: 1, nombre: 'Nitro Boost (1 Mes)', precio: 5.50 },
        { id: 2, nombre: 'Nitro Basic (1 Mes)', precio: 2.50 },
        { id: 3, nombre: 'Spotify Premium (3 Meses)', precio: 3.50 },
        { id: 4, nombre: 'Minecraft MFA Premium', precio: 8.00 }
    ];

    let carrito = [];

    window.addEventListener('DOMContentLoaded', () => {
        cargarCatalogo();
        cargarMisTickets(usuarioActual);
    });

    // 3. Sistema de Tienda y Carrito
    function cargarCatalogo() {
        const contenedor = document.getElementById('catalogo-productos');
        productosDB.forEach(prod => {
            contenedor.innerHTML += `
                <div class="product-item">
                    <div class="product-title">${prod.nombre}</div>
                    <div class="product-price">$${prod.precio.toFixed(2)}</div>
                    <button class="btn-add" onclick="agregarAlCarrito(${prod.id})">+ Agregar al carrito</button>
                </div>
            `;
        });
    }

    function agregarAlCarrito(idProducto) {
        const producto = productosDB.find(p => p.id === idProducto);
        
        // Buscar si ya está en el carrito para sumar cantidad
        const itemExistente = carrito.find(p => p.id === idProducto);
        if (itemExistente) {
            itemExistente.cantidad++;
        } else {
            carrito.push({ ...producto, cantidad: 1 });
        }
        
        actualizarCarritoUI();
    }

    function vaciarCarrito() {
        carrito = [];
        actualizarCarritoUI();
    }

    function actualizarCarritoUI() {
        const cartContent = document.getElementById('cart-content');
        const btnComprar = document.getElementById('btn-comprar');
        let total = 0;

        if (carrito.length === 0) {
            cartContent.innerHTML = '<div class="cart-empty">Tu carrito está vacío</div>';
            document.getElementById('cart-total').innerText = '$0.00';
            btnComprar.classList.remove('active');
            return;
        }

        cartContent.innerHTML = '';
        carrito.forEach(item => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal;
            cartContent.innerHTML += `
                <div class="cart-item">
                    <span>${item.cantidad}x ${item.nombre}</span>
                    <span style="color: #38bdf8;">$${subtotal.toFixed(2)}</span>
                </div>
            `;
        });

        document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        btnComprar.classList.add('active'); // Activa el botón de comprar
    }

    // 4. Generación de Tickets Dinámica
    async function generarTicket() {
        if (carrito.length === 0) return;

        const codigoTicket = 'MR-' + Math.floor(100000 + Math.random() * 900000);
        
        // Crear el string de detalles basado en el carrito
        const detallesCompra = carrito.map(item => `${item.cantidad}x ${item.nombre}`).join(' | ');
        const totalCompra = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

        const { error } = await supabaseClient
            .from('tickets')
            .insert([{ codigo: codigoTicket, cliente: usuarioActual, detalles: detallesCompra, total: totalCompra, estado: 'Pendiente' }]);

        if (error) {
            alert('Error al generar el ticket: ' + error.message);
        } else {
            alert('¡Compra iniciada! Se ha generado tu ticket de pago.');
            vaciarCarrito();
            cargarMisTickets(usuarioActual);
        }
    }

    // 5. Historial de Tickets y Chat (Igual que antes)
    async function cargarMisTickets(username) {
        const { data, error } = await supabaseClient.from('tickets').select('*').eq('cliente', username).order('id', { ascending: false });
        const container = document.getElementById('tickets-list-container');
        const section = document.getElementById('user-tickets-section');

        if (error || !data || data.length === 0) { section.style.display = 'none'; return; }

        section.style.display = 'block';
        container.innerHTML = '';

        data.forEach(ticket => {
            const colorBadge = ticket.estado === 'Completado' ? '#10b981' : '#f59e0b';
            container.innerHTML += `
                <div class="ticket-item">
                    <div class="ticket-header">
                        <span class="ticket-code">${ticket.codigo}</span>
                        <button class="btn-chat" onclick="abrirChat('${ticket.codigo}')">💬 Chat</button>
                    </div>
                    <div class="ticket-desc">${ticket.detalles}</div>
                    <div class="ticket-footer">
                        <span style="font-size: 12px; color: #94a3b8;">Total: $${ticket.total}</span>
                        <span class="ticket-badge" style="background: ${colorBadge};">${ticket.estado || 'Pendiente'}</span>
                    </div>
                </div>`;
        });
    }

    let ticketActivoChat = null;

    async function abrirChat(codigo) {
        ticketActivoChat = codigo;
        document.getElementById('chat-title').innerText = 'Ticket ' + codigo;
        document.getElementById('chat-modal').style.display = 'flex';
        cargarMensajes();
    }

    function cerrarChat() { document.getElementById('chat-modal').style.display = 'none'; ticketActivoChat = null; }

    async function cargarMensajes() {
        if (!ticketActivoChat) return;
        const { data } = await supabaseClient.from('mensajes').select('*').eq('ticket_codigo', ticketActivoChat).order('created_at', { ascending: true });
        const box = document.getElementById('chat-messages');
        box.innerHTML = '';
        if (!data || data.length === 0) { box.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:13px; margin-top:20px;">No hay mensajes.</div>'; return; }

        data.forEach(msg => {
            const isMe = msg.autor === usuarioActual;
            box.innerHTML += `<div class="msg ${isMe ? 'msg-mio' : 'msg-otro'}"><b style="font-size:11px; display:block; margin-bottom:3px;">${msg.autor}</b>${msg.contenido}</div>`;
        });
        box.scrollTop = box.scrollHeight;
    }

    async function enviarMensaje() {
        const input = document.getElementById('chat-input');
        const texto = input.value.trim();
        if (!texto || !ticketActivoChat) return;
        input.disabled = true;
        await supabaseClient.from('mensajes').insert([{ ticket_codigo: ticketActivoChat, autor: usuarioActual, contenido: texto }]);
        input.value = ''; input.disabled = false; input.focus();
        cargarMensajes();
    }
</script>
</body>
</html>
