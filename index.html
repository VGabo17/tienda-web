<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRSTORE - Digital Vault</title>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #07090e; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        
        /* Encabezado */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header span { color: #38bdf8; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Tarjetas Principales */
        .card { background: rgba(18, 24, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .total-box { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-size: 18px; font-weight: bold; }
        .total-price { color: #38bdf8; }
        .user-box { background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 14px; color: #cbd5e1; }
        .user-box span { color: #38bdf8; font-weight: bold; }
        
        /* Botones */
        .btn { width: 100%; background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .logout-link { display: block; text-align: center; margin-top: 10px; color: #ef4444; font-size: 12px; text-decoration: none; }
        
        /* Lista de Tickets */
        .ticket-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .ticket-code { color: #38bdf8; font-weight: bold; font-size: 15px; }
        .ticket-desc { color: #94a3b8; font-size: 13px; margin-bottom: 8px; }
        .ticket-footer { display: flex; justify-content: space-between; align-items: center; }
        .ticket-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #000; }
        .btn-chat { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; display: flex; gap: 5px; align-items: center; }

        /* Modal de Chat */
        #chat-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .chat-box { background: #121826; width: 100%; max-width: 450px; border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; height: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px; }
        .chat-messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding-right: 5px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; max-width: 85%; line-height: 1.4; }
        .msg-mio { background: #3b82f6; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .msg-otro { background: #374151; align-self: flex-start; color: white; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #07090e; color: white; outline: none; }
        .btn-send { background: #10b981; color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-refresh { background: #4b5563; color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ MRSTORE</h1>
        <span>Digital Vault</span>
    </div>

    <!-- Sección del Carrito -->
    <div class="card">
        <h3 style="margin-bottom: 15px; font-size: 16px;">Tu Carrito de Compras</h3>
        <div id="cart-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;">
                <span>Nitro Boost (1 Mes) + Minecraft MFA</span>
                <span style="color: #38bdf8;">$13.30</span>
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 15px 0;">
        <div class="total-box">
            <span>Total a Pagar:</span>
            <span class="total-price" id="cart-total">$13.30</span>
        </div>

        <div class="user-box">
            Conectado como: <span id="discord-user">@vgabo17</span>
        </div>

        <button class="btn" onclick="generarTicket()">🚀 Generar Ticket de Compra</button>
        <a href="#" class="logout-link" onclick="cerrarSesion()">Cerrar sesión de Discord</a>
    </div>

    <!-- Sección de Mis Tickets -->
    <div class="card" id="user-tickets-section" style="display: none;">
        <h3 style="margin-bottom: 15px; font-size: 16px;">📦 Tus Tickets Activos</h3>
        <div id="tickets-list-container"></div>
    </div>
</div>

<!-- Modal de Chat -->
<div id="chat-modal">
    <div class="chat-box">
        <div class="chat-header">
            <div>
                <h3 id="chat-title" style="color: #38bdf8; font-size: 18px;">Chat del Ticket</h3>
                <span style="font-size: 12px; color: #94a3b8;">Soporte MRSTORE</span>
            </div>
            <button onclick="cerrarChat()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Cerrar X</button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- Mensajes se cargarán aquí -->
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe tu mensaje aquí..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
            <button class="btn-refresh" onclick="cargarMensajes()" title="Actualizar Mensajes">🔄</button>
            <button class="btn-send" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
</div>

<script>
    // Configuración de Supabase
    const SUPABASE_URL = 'https://luupinikdeakeisitget.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PLfWM4kKES8hWFVIY5yatA_MT9Tm7Kq';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let usuarioActual = localStorage.getItem('discord_user') || '@vgabo17';
    let ticketActivoChat = null;

    document.getElementById('discord-user').innerText = usuarioActual;

    window.addEventListener('DOMContentLoaded', () => {
        cargarMisTickets(usuarioActual);
    });

    // 1. Funciones de Compra y Tickets
    async function generarTicket() {
        const codigoTicket = 'MR-' + Math.floor(100000 + Math.random() * 900000);
        const detallesCompra = 'Nitro Boost (1 Mes) + Minecraft MFA Premium';
        const totalCompra = 13.30;

        const { error } = await supabaseClient
            .from('tickets')
            .insert([{ codigo: codigoTicket, cliente: usuarioActual, detalles: detallesCompra, total: totalCompra, estado: 'Pendiente' }]);

        if (error) {
            alert('Error al generar el ticket: ' + error.message);
        } else {
            alert('¡Ticket generado con éxito! Puedes verlo y abrir el chat abajo.');
            cargarMisTickets(usuarioActual);
        }
    }

    async function cargarMisTickets(username) {
        const { data, error } = await supabaseClient
            .from('tickets')
            .select('*')
            .eq('cliente', username)
            .order('id', { ascending: false });

        const container = document.getElementById('tickets-list-container');
        const section = document.getElementById('user-tickets-section');

        if (error || !data || data.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        container.innerHTML = '';

        data.forEach(ticket => {
            const div = document.createElement('div');
            div.className = 'ticket-item';
            
            const colorBadge = ticket.estado === 'Completado' ? '#10b981' : '#f59e0b';

            div.innerHTML = `
                <div class="ticket-header">
                    <span class="ticket-code">${ticket.codigo}</span>
                    <button class="btn-chat" onclick="abrirChat('${ticket.codigo}')">💬 Abrir Chat</button>
                </div>
                <div class="ticket-desc">${ticket.detalles}</div>
                <div class="ticket-footer">
                    <span style="font-size: 12px; color: #94a3b8;">Total: $${ticket.total}</span>
                    <span class="ticket-badge" style="background: ${colorBadge};">${ticket.estado || 'Pendiente'}</span>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // 2. Funciones del Chat Integrado
    async function abrirChat(codigo) {
        ticketActivoChat = codigo;
        document.getElementById('chat-title').innerText = 'Ticket ' + codigo;
        document.getElementById('chat-modal').style.display = 'flex';
        cargarMensajes();
    }

    function cerrarChat() {
        document.getElementById('chat-modal').style.display = 'none';
        ticketActivoChat = null;
    }

    async function cargarMensajes() {
        if (!ticketActivoChat) return;
        const { data, error } = await supabaseClient
            .from('mensajes')
            .select('*')
            .eq('ticket_codigo', ticketActivoChat)
            .order('created_at', { ascending: true });
        
        const box = document.getElementById('chat-messages');
        box.innerHTML = '';

        if (!data || data.length === 0) {
            box.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:13px; margin-top:20px;">No hay mensajes. ¡Escribe a soporte!</div>';
            return;
        }

        data.forEach(msg => {
            const isMe = msg.autor === usuarioActual;
            box.innerHTML += `
                <div class="msg ${isMe ? 'msg-mio' : 'msg-otro'}">
                    <b style="font-size:11px; opacity:0.8; display:block; margin-bottom:3px;">${msg.autor}</b>
                    ${msg.contenido}
                </div>`;
        });
        box.scrollTop = box.scrollHeight; // Auto-scroll hacia abajo
    }

    async function enviarMensaje() {
        const input = document.getElementById('chat-input');
        const texto = input.value.trim();
        if (!texto || !ticketActivoChat) return;

        input.disabled = true; // Prevenir doble envío
        await supabaseClient.from('mensajes').insert([{ ticket_codigo: ticketActivoChat, autor: usuarioActual, contenido: texto }]);
        
        input.value = '';
        input.disabled = false;
        input.focus();
        cargarMensajes();
    }

    function cerrarSesion() {
        localStorage.removeItem('discord_user');
        location.reload();
    }
</script>

</body>
</html>
